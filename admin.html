<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Diamond Interiors - Master Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAFEcOjXg-UgcDLiXJaidvDLmo065tHnYc",
      authDomain: "diamond-interior.firebaseapp.com",
      databaseURL: "https://diamond-interior-default-rtdb.firebaseio.com",
      projectId: "diamond-interior",
      storageBucket: "diamond-interior.appspot.com",
      messagingSenderId: "743080237212",
      appId: "1:743080237212:web:3801f08600dd2b54293559",
      measurementId: "G-VPJ952EL89"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();
  </script>

  <style>
    :root {
      --void: #060403;
      --surface: #0e0a07;
      --surface-2: #16110b;
      --card: #120d09;
      --gold: #c9943a;
      --gold-bright: #f3cf7a;
      --platinum: #eae2d3;
      --text-muted: #9f9382;
      --border: rgba(201, 148, 58, 0.25);
      --grad-gold: linear-gradient(135deg, #f5d485 0%, #c9943a 50%, #7e561a 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--void);
      color: var(--platinum);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold-bright);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }
    .nav-btn:hover, .nav-btn.active {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--gold-bright);
    }

    .main-content {
      flex: 1;
      padding: 32px 36px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    .header-box { margin-bottom: 24px; }
    .header-box h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      color: var(--gold-bright);
      margin-bottom: 6px;
    }
    .header-box p { color: var(--text-muted); font-size: 0.95rem; }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 36px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group.full { grid-column: span 2; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .form-control:focus { border-color: var(--gold-bright); }

    .file-input-box {
      border: 1px dashed var(--border);
      background: var(--surface-2);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .file-input-box input[type="file"] {
      color: var(--platinum);
      cursor: pointer;
    }

    .progress-wrapper {
      margin-top: 14px;
      display: none;
    }
    .progress-bar {
      height: 8px;
      width: 0%;
      background: var(--grad-gold);
      border-radius: 6px;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 0.85rem;
      color: var(--gold-bright);
      margin-top: 6px;
    }

    .submit-btn {
      background: var(--grad-gold);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      margin-top: 8px;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Category Filter Buttons in Admin */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--gold);
      color: #000;
      font-weight: 600;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-media {
      height: 190px;
      width: 100%;
      object-fit: cover;
      background: #000;
    }
    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.05rem; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      background: rgba(201, 148, 58, 0.15);
      color: var(--gold-bright);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .card-loc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; }
    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: static; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand-logo">Diamond Interiors</div>
    <ul class="nav-list">
      <li><button class="nav-btn active" onclick="switchTab('portfolio')">📸 Portfolio Photos</button></li>
      <li><button class="nav-btn" onclick="switchTab('hero')">🎞️ Top Loop Videos</button></li>
      <li><button class="nav-btn" onclick="switchTab('reels')">🎬 Video Walkthroughs</button></li>
    </ul>
  </aside>

  <main class="main-content">
    
    <!-- 1. PORTFOLIO PHOTOS -->
    <section id="tab-portfolio" class="view-panel active">
      <div class="header-box">
        <h1>Portfolio Showcase</h1>
        <p>फ़ोटो अपलोड करें और सही कैटेगरी व लोकेशन चुनें।</p>
      </div>

      <div class="form-card">
        <form id="portfolioForm" onsubmit="handlePortfolioUpload(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Project Title (नाम)</label>
              <input type="text" id="pTitle" class="form-control" placeholder="उदा: Modular Kitchen Suite" required>
            </div>
            <div class="form-group">
              <label>Category (श्रेणी)</label>
              <select id="pCategory" class="form-control" required>
                <option value="kitchens">Kitchens</option>
                <option value="bedrooms">Bedrooms</option>
                <option value="living">Living & Dining</option>
                <option value="commercial">Commercial & Hotels</option>
              </select>
            </div>
            <div class="form-group full">
              <label>Location (स्थान)</label>
              <input type="text" id="pLocation" class="form-control" placeholder="उदा: Bandra, Mumbai या Thane West" required>
            </div>
            <div class="form-group full">
              <label>Photo File</label>
              <div class="file-input-box">
                <input type="file" id="pFile" accept="image/*" required>
              </div>
              <div class="progress-wrapper" id="pProgressWrapper">
                <div class="progress-bar" id="pProgressBar"></div>
                <div class="progress-text" id="pProgressText">Uploading... 0%</div>
              </div>
            </div>
          </div>
          <button type="submit" id="pSubmitBtn" class="submit-btn">Upload & Publish Photo</button>
        </form>
      </div>

      <!-- Category Filter -->
      <div class="filter-bar">
        <button class="filter-btn active" onclick="filterPortfolio('all')">All Work</button>
        <button class="filter-btn" onclick="filterPortfolio('kitchens')">Kitchens</button>
        <button class="filter-btn" onclick="filterPortfolio('bedrooms')">Bedrooms</button>
        <button class="filter-btn" onclick="filterPortfolio('living')">Living & Dining</button>
        <button class="filter-btn" onclick="filterPortfolio('commercial')">Commercial & Hotels</button>
      </div>

      <div id="portfolioGrid" class="items-grid"></div>
    </section>

    <!-- 2. HERO VIDEOS -->
    <section id="tab-hero" class="view-panel">
      <div class="header-box">
        <h1>Hero Header Loop Video</h1>
        <p>होमपेज के बैकग्राउंड में लूप होने वाला वीडियो।</p>
      </div>

<form id="hero-header-form">
  <label for="showcase-title">SHOWCASE TITLE</label>
  <input type="text" id="showcase-title" placeholder="उदा: Luxury MMR Living" required>

  <label for="video-link">VIDEO LINK</label>
  <input type="url" id="video-link" placeholder="उदा: https://www.youtube.com/watch?v=..." required>

  <button type="submit">Upload Video Link</button>
</form>


      <div id="heroGrid" class="items-grid"></div>
    </section>

    <!-- 3. REELS -->
    <section id="tab-reels" class="view-panel">
      <div class="header-box">
        <h1>Video Walkthroughs (Reels)</h1>
        <p>प्रोजेक्ट्स की वर्टिकल रील्स या वॉकथ्रू वीडियो अपलोड करें।</p>
      </div>

      <div class="form-card">
        <form id="reelForm" onsubmit="handleReelUpload(event)">
          <div class="form-group">
            <label>Reel Title</label>
            <input type="text" id="rTitle" class="form-control" placeholder="उदा: 3BHK Turnkey Reveal" required>
          </div>
          <div class="form-group">
            <label>Video File (MP4)</label>
            <div class="file-input-box">
              <input type="file" id="rFile" accept="video/mp4,video/webm" required>
            </div>
            <div class="progress-wrapper" id="rProgressWrapper">
              <div class="progress-bar" id="rProgressBar"></div>
              <div class="progress-text" id="rProgressText">Uploading... 0%</div>
            </div>
          </div>
          <button type="submit" id="rSubmitBtn" class="submit-btn">Upload Reel</button>
        </form>
      </div>

      <div id="reelsGrid" class="items-grid"></div>
    </section>

  </main>

  <script>
    let allPortfolioItems = {};
    let currentFilter = 'all';

    function switchTab(tabId) {
      document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Helper: Resumable Upload with Progress Bar
    function uploadWithProgress(file, folder, wrapperId, barId, textId) {
      return new Promise((resolve, reject) => {
        const wrapper = document.getElementById(wrapperId);
        const bar = document.getElementById(barId);
        const text = document.getElementById(textId);

        wrapper.style.display = 'block';
        bar.style.width = '0%';
        text.innerText = 'Starting upload... 0%';

        const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '')}`;
        const uploadTask = storage.ref(`${folder}/${fileName}`).put(file);

        uploadTask.on('state_changed', 
          (snapshot) => {
            const progress = ((snapshot.bytesTransferred / snapshot.totalBytes) * 100).toFixed(0);
            bar.style.width = progress + '%';
            text.innerText = `Uploading: ${progress}% (${(snapshot.bytesTransferred / (1024*1024)).toFixed(1)}MB / ${(snapshot.totalBytes / (1024*1024)).toFixed(1)}MB)`;
          }, 
          (error) => {
            wrapper.style.display = 'none';
            reject(error);
          }, 
          async () => {
            const url = await uploadTask.snapshot.ref.getDownloadURL();
            wrapper.style.display = 'none';
            resolve(url);
          }
        );
      });
    }

    // 1. Portfolio Upload
    async function handlePortfolioUpload(e) {
      e.preventDefault();
      const title = document.getElementById('pTitle').value;
      const category = document.getElementById('pCategory').value;
      const location = document.getElementById('pLocation').value;
      const file = document.getElementById('pFile').files[0];
      const btn = document.getElementById('pSubmitBtn');

      if (!file) return;

      try {
        btn.disabled = true;
        const imageUrl = await uploadWithProgress(file, 'portfolio_images', 'pProgressWrapper', 'pProgressBar', 'pProgressText');

        await db.ref('portfolio').push({
          title: title,
          category: category,
          location: location,
          image: imageUrl,
          timestamp: Date.now()
        });

        document.getElementById('portfolioForm').reset();
        alert('फ़ोटो सफलतापूर्वक अपलोड हो गई है!');
      } catch (err) {
        alert('Upload Error: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    // Load & Filter Portfolio
    db.ref('portfolio').on('value', snap => {
      allPortfolioItems = snap.val() || {};
      renderPortfolio();
    });

    function filterPortfolio(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderPortfolio();
    }

    function renderPortfolio() {
      const grid = document.getElementById('portfolioGrid');
      grid.innerHTML = '';

      const entries = Object.entries(allPortfolioItems);
      if (entries.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-muted)">अभी तक कोई फ़ोटो नहीं है।</p>';
        return;
      }

      entries.forEach(([id, item]) => {
        if (currentFilter !== 'all' && item.category !== currentFilter) return;

        grid.innerHTML += `
          <div class="card-item">
            <img src="${item.image}" class="card-media" alt="${item.title}">
            <div class="card-body">
              <div>
                <span class="card-tag">${item.category.toUpperCase()}</span>
                <div class="card-title">${item.title}</div>
                <div class="card-loc">📍 ${item.location || 'Mumbai/Thane'}</div>
              </div>
              <button class="delete-btn" onclick="deleteEntry('portfolio', '${id}')">Delete</button>
            </div>
          </div>
        `;
      });
    }

    // 2. Hero Video Upload
    async function handleHeroUpload(e) {
      e.preventDefault();
      const title = document.getElementById('hTitle').value;
      const file = document.getElementById('hFile').files[0];
      const btn = document.getElementById('hSubmitBtn');

      if (!file) return;

      try {
   document.getElementById('hero-header-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const title = document.getElementById('showcase-title').value;
  const link = document.getElementById('video-link').value;
  
  // Realtime Database में डेटा सेव करने की लॉजिक यहाँ आएगी
  console.log("Saving to DB:", title, link);
  alert("Link saved successfully!");
});

    }

    db.ref('hero_videos').on('value', snap => {
      const grid = document.getElementById('heroGrid');
      grid.innerHTML = '';
      const data = snap.val() || {};
      Object.entries(data).forEach(([id, item]) => {
        grid.innerHTML += `
          <div class="card-item">
            <video src="${item.videoUrl}" class="card-media" controls autoplay muted loop></video>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <button class="delete-btn" onclick="deleteEntry('hero_videos', '${id}')">Delete</button>
            </div>
          </div>
        `;
      });
    });

    // 3. Reels Upload
    async function handleReelUpload(e) {
      e.preventDefault();
      const title = document.getElementById('rTitle').value;
      const file = document.getElementById('rFile').files[0];
      const btn = document.getElementById('rSubmitBtn');

      if (!file) return;

      try {
        btn.disabled = true;
        const videoUrl = await uploadWithProgress(file, 'reel_videos', 'rProgressWrapper', 'rProgressBar', 'rProgressText');

        await db.ref('reels').push({
          title: title,
          videoUrl: videoUrl,
          timestamp: Date.now()
        });

        document.getElementById('reelForm').reset();
        alert('रील अपलोड हो गई!');
      } catch (err) {
        alert('Reel Upload Error: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    db.ref('reels').on('value', snap => {
      const grid = document.getElementById('reelsGrid');
      grid.innerHTML = '';
      const data = snap.val() || {};
      Object.entries(data).forEach(([id, item]) => {
        grid.innerHTML += `
          <div class="card-item">
            <video src="${item.videoUrl}" class="card-media" controls></video>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
              <button class="delete-btn" onclick="deleteEntry('reels', '${id}')">Delete</button>
            </div>
          </div>
        `;
      });
    });

    async function deleteEntry(path, id) {
      if (confirm('क्या आप इसे हटाना चाहते हैं?')) {
        await db.ref(`${path}/${id}`).remove();
      }
    }
  </script>
</body>
</html>

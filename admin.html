<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Dashboard | Diamond Interiors</title>

  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --void: #060403;
      --surface: #0c0906;
      --surface-2: #140e0a;
      --card-bg: #110c08;
      --gold: #c9943a;
      --gold-bright: #f0c96a;
      --platinum: #eae2d3;
      --text-dim: #ada190;
      --line: rgba(201, 148, 58, 0.2);
      --line-bright: rgba(240, 201, 106, 0.4);
      --accent: linear-gradient(135deg, #f0c96a 0%, #c9943a 50%, #7a5620 100%);
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--void);
      color: var(--platinum);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* LOGIN SCREEN */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--line-bright);
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8), 0 0 25px rgba(201, 148, 58, 0.2);
      text-align: center;
    }
    .login-card h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 6px;
    }
    .login-card p {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 24px;
    }
    .input-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold-bright);
      margin-bottom: 6px;
    }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus, .input-group select:focus {
      border-color: var(--gold-bright);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #1a0e02;
      border: none;
      border-radius: 999px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(201, 148, 58, 0.4);
    }
    .login-error {
      color: var(--danger);
      font-size: 0.82rem;
      margin-top: 12px;
      display: none;
    }

    /* DASHBOARD */
    #dashboardScreen {
      display: none;
      flex-direction: column;
      flex: 1;
    }
    .dash-header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dash-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      color: #fff;
      font-weight: 700;
    }
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .dash-body {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .grid-forms {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    @media (max-width: 768px) {
      .grid-forms { grid-template-columns: 1fr; }
    }

    .panel-box {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
    }
    .panel-box h3 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      color: var(--gold-bright);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* CATEGORY TOGGLE */
    .custom-cat-box {
      margin-top: 8px;
      display: none;
    }

    /* LIST CONTAINERS */
    .section-heading {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      color: #fff;
      margin: 20px 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .item-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .item-media {
      width: 100%;
      aspect-ratio: 16/10;
      background: #000;
      object-fit: cover;
    }
    .item-info {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .item-info h4 {
      font-size: 0.88rem;
      color: #fff;
      margin-bottom: 2px;
    }
    .item-info span {
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>Diamond Interiors</h2>
      <p>Secure Portal Login</p>
      
      <form id="loginForm">
        <div class="input-group">
          <label>Login ID</label>
          <input type="text" id="loginId" placeholder="Enter Login ID" autocomplete="username" required />
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="loginPass" placeholder="Enter Password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-submit">Sign In to Dashboard</button>
        <div id="loginError" class="login-error">Invalid Login ID or Password. Try again.</div>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD -->
  <div id="dashboardScreen">
    <header class="dash-header">
      <div class="dash-title">✦ Diamond Interiors — Admin Portal</div>
      <button class="btn-logout" id="logoutBtn">Log Out</button>
    </header>

    <div class="dash-body">
      <div class="grid-forms">
        
        <!-- Add Photo Section -->
        <div class="panel-box">
          <h3>🖼️ Add Project Photo</h3>
          <form id="addPhotoForm">
            <div class="input-group">
              <label>Select Category or Create New</label>
              <select id="photoCategory" onchange="toggleCustomCategory(this.value)" required>
                <option value="Kitchens">Kitchens</option>
                <option value="Bedrooms">Bedrooms</option>
                <option value="Living & Dining">Living & Dining</option>
                <option value="Commercial">Commercial & Hotels</option>
                <option value="Bathroom">Bathroom</option>
                <option value="Wardrobes">Wardrobes</option>
                <option value="False Ceiling">False Ceiling</option>
                <option value="__NEW__">➕ Add Custom Category / Section...</option>
              </select>
              <div class="custom-cat-box" id="customCatBox">
                <input type="text" id="customCatInput" placeholder="Enter new category name (e.g. Balcony, Study Room)" />
              </div>
            </div>

            <!-- Choose Image Source -->
            <div class="input-group">
              <label>Upload From Device / Phone Gallery</label>
              <input type="file" id="photoFileInput" accept="image/*" />
            </div>

            <div class="input-group">
              <label>Or Paste Online Photo URL (Optional)</label>
              <input type="url" id="photoUrl" placeholder="https://..." />
            </div>

            <div class="input-group">
              <label>Project Title</label>
              <input type="text" id="photoTitle" placeholder="e.g. Luxury Minimalist Kitchen" required />
            </div>

            <div class="input-group">
              <label>Location</label>
              <input type="text" id="photoLocation" placeholder="e.g. Bandra, Mumbai or Thane" required />
            </div>

            <button type="submit" class="btn-submit" id="photoSubmitBtn">Upload to Website Gallery</button>
          </form>
        </div>

        <!-- Add Video Section -->
        <div class="panel-box">
          <h3>🎥 Add Video Reel / Walkthrough</h3>
          <form id="addVideoForm">
            <div class="input-group">
              <label>Select Category</label>
              <select id="videoCategory">
                <option value="Reels">Showcase Reel</option>
                <option value="Kitchens">Kitchen Walkthrough</option>
                <option value="Bedrooms">Bedroom Walkthrough</option>
                <option value="Living">Living Room Video</option>
                <option value="Commercial">Commercial Tour</option>
              </select>
            </div>

            <div class="input-group">
              <label>Video Direct MP4 URL</label>
              <input type="url" id="videoUrl" placeholder="https://.../video.mp4" required />
            </div>

            <div class="input-group">
              <label>Reel Title</label>
              <input type="text" id="videoTitle" placeholder="e.g. 3BHK Luxury Walkthrough" required />
            </div>

            <div class="input-group">
              <label>Reel Badge / Tag</label>
              <input type="text" id="videoBadge" placeholder="e.g. SHOWCASE REEL 04" />
            </div>

            <button type="submit" class="btn-submit">Add Video Reel</button>
          </form>
        </div>

      </div>

      <!-- Live Lists -->
      <div class="section-heading">
        <span>📸 Current Website Portfolio Photos</span>
      </div>
      <div class="items-grid" id="portfolioList"></div>

      <div class="section-heading">
        <span>🎬 Current Website Videos</span>
      </div>
      <div class="items-grid" id="videoList"></div>

    </div>
  </div>

  <script>
    const AUTH_USER = "prabhat";
    const AUTH_PASS = "pro_boy39";

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');

    if (sessionStorage.getItem('diamond_auth') === 'true') {
      showDashboard();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('loginId').value.trim();
      const p = document.getElementById('loginPass').value.trim();

      if (u === AUTH_USER && p === AUTH_PASS) {
        sessionStorage.setItem('diamond_auth', 'true');
        showDashboard();
      } else {
        loginError.style.display = 'block';
      }
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('diamond_auth');
      dashboardScreen.style.display = 'none';
      loginScreen.style.display = 'flex';
      loginForm.reset();
      loginError.style.display = 'none';
    });

    function showDashboard() {
      loginScreen.style.display = 'none';
      dashboardScreen.style.display = 'flex';
      initFirebaseSync();
    }

    function toggleCustomCategory(val) {
      const box = document.getElementById('customCatBox');
      box.style.display = (val === '__NEW__') ? 'block' : 'none';
    }

    /* ── FIREBASE REALTIME DATABASE SYNC ── */
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForDiamondInteriorsSync",
      authDomain: "diamond-interiors.firebaseapp.com",
      databaseURL: "https://diamond-interiors-default-rtdb.firebaseio.com",
      projectId: "diamond-interiors",
      storageBucket: "diamond-interiors.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    let db;
    function initFirebaseSync() {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.database();

      // Listen for Photos
      db.ref('portfolio').on('value', (snap) => {
        const data = snap.val();
        const container = document.getElementById('portfolioList');
        container.innerHTML = '';
        if (data) {
          Object.entries(data).forEach(([key, item]) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
              <img src="${item.url}" class="item-media" onerror="this.src='1664.png'" alt="${item.title}">
              <div class="item-info">
                <div>
                  <h4>${item.title}</h4>
                  <span>🏷️ ${item.category} | 📍 ${item.location}</span>
                </div>
                <button class="btn-delete" onclick="deletePhoto('${key}')">Remove Photo</button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p style="color:var(--text-dim); font-size:0.85rem;">No custom photos uploaded yet.</p>';
        }
      });

      // Listen for Videos
      db.ref('promo_videos').on('value', (snap) => {
        const data = snap.val();
        const container = document.getElementById('videoList');
        container.innerHTML = '';
        if (data) {
          Object.entries(data).forEach(([key, item]) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerHTML = `
              <video src="${item.url}" class="item-media" muted playsinline></video>
              <div class="item-info">
                <div>
                  <h4>${item.title}</h4>
                  <span>🏷️ ${item.badge || 'Showcase Video'}</span>
                </div>
                <button class="btn-delete" onclick="deleteVideo('${key}')">Remove Video</button>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p style="color:var(--text-dim); font-size:0.85rem;">No custom videos uploaded yet.</p>';
        }
      });
    }

    // Helper: Read gallery file as Base64 string
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    // Submit Photo (Direct File or URL)
    document.getElementById('addPhotoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const selectCat = document.getElementById('photoCategory').value;
      const customCat = document.getElementById('customCatInput').value.trim();
      const category = (selectCat === '__NEW__') ? (customCat || 'General') : selectCat;

      const fileInput = document.getElementById('photoFileInput');
      const urlInput = document.getElementById('photoUrl').value.trim();
      const title = document.getElementById('photoTitle').value.trim();
      const location = document.getElementById('photoLocation').value.trim();

      let finalUrl = urlInput;
      if (fileInput.files && fileInput.files[0]) {
        const btn = document.getElementById('photoSubmitBtn');
        btn.textContent = 'Processing Image...';
        btn.disabled = true;
        try {
          finalUrl = await fileToBase64(fileInput.files[0]);
        } catch (err) {
          alert('Could not process device image.');
          btn.textContent = 'Upload to Website Gallery';
          btn.disabled = false;
          return;
        }
      }

      if (!finalUrl) {
        alert('Please either choose an image file from your gallery or paste an image URL.');
        return;
      }

      db.ref('portfolio').push({
        category,
        url: finalUrl,
        title,
        location,
        timestamp: Date.now()
      }).then(() => {
        alert(`Photo added to "${category}" section successfully!`);
        document.getElementById('addPhotoForm').reset();
        toggleCustomCategory('Kitchens');
      }).catch(err => alert('Upload error: ' + err.message))
      .finally(() => {
        const btn = document.getElementById('photoSubmitBtn');
        btn.textContent = 'Upload to Website Gallery';
        btn.disabled = false;
      });
    });

    // Submit Video
    document.getElementById('addVideoForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const category = document.getElementById('videoCategory').value;
      const url = document.getElementById('videoUrl').value.trim();
      const title = document.getElementById('videoTitle').value.trim();
      const badge = document.getElementById('videoBadge').value.trim() || 'STUDIO REEL';

      db.ref('promo_videos').push({
        category,
        url,
        title,
        badge,
        timestamp: Date.now()
      }).then(() => {
        alert('Video added successfully!');
        document.getElementById('addVideoForm').reset();
      }).catch(err => alert('Upload error: ' + err.message));
    });

    window.deletePhoto = function(key) {
      if (confirm('Delete this photo from website?')) {
        db.ref('portfolio/' + key).remove();
      }
    };

    window.deleteVideo = function(key) {
      if (confirm('Delete this video from website?')) {
        db.ref('promo_videos/' + key).remove();
      }
    };
  </script>
</body>
</html>
